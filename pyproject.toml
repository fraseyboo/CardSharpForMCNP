[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cardsharp-mcnp"
version = "0.1.0"
description = "Python tools for creating MCNP6 input decks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "license.txt" }
dependencies = ["numpy>=1.26"]

[tool.setuptools]
py-modules = [
  "CardSharp",
  "CardSharpMats",
  "CardSharpMcTallyRead",
  "CardSharpModelRun",
  "matCompendiumIsotopic",
  "matDataAdditional",
  "mctal",
]
package-dir = { "" = "CardSharp" }
